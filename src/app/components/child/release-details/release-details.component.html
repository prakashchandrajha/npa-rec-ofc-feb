<div class="section-div p-6 bg-white rounded-lg shadow">
  <h3 class="text-xl font-semibold mb-6 text-gray-800 border-b pb-3">4. Release Details</h3>
  
  <form [formGroup]="form">
    <div formArrayName="releases" class="overflow-x-auto">
      <table class="w-full border-collapse border border-gray-300 text-sm">
        <thead>
          <tr class="bg-gray-100">
            <th class="border border-gray-300 p-2 text-center w-12 font-medium">Sr.</th>
            <th class="border border-gray-300 p-2 text-left font-medium">Date of Release</th>
            <th class="border border-gray-300 p-2 text-left font-medium">Against Release Letter</th>
            <th class="border border-gray-300 p-2 text-left font-medium">Amount</th>
            <th class="border border-gray-300 p-2 text-center w-16 font-medium">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let release of releases.controls; let i = index" 
            [formGroupName]="i" 
            class="hover:bg-gray-50 transition-colors">
            
            <!-- Serial Number -->
            <td class="border border-gray-300 p-2 text-center font-medium">
              {{ i + 1 }}
            </td>
            
            <!-- Date of Release -->
            <td class="border border-gray-300 p-2">
              <input formControlName="dateOfRelease" 
                type="date" 
                class="w-full p-1.5 border border-gray-300 rounded focus:ring-1 focus:ring-blue-500 focus:border-blue-500">
            </td>
            
            <!-- Against Release Letter -->
            <td class="border border-gray-300 p-2">
              <input formControlName="againstReleaseLetter" 
                type="text" 
                placeholder="Enter release letter details"
                class="w-full p-1.5 border border-gray-300 rounded focus:ring-1 focus:ring-blue-500 focus:border-blue-500">
            </td>
            
            <!-- Amount -->
            <td class="border border-gray-300 p-2">
              <input formControlName="amount" 
                type="number" 
                placeholder="Enter amount"
                class="w-full p-1.5 border border-gray-300 rounded focus:ring-1 focus:ring-blue-500 focus:border-blue-500">
            </td>
            
            <!-- Action -->
            <td class="border border-gray-300 p-2 text-center">
              <button type="button" 
                (click)="removeRelease(i)" 
                class="px-2 py-1 bg-red-500 text-white rounded hover:bg-red-600 text-xs transition-colors"
                [class.opacity-50]="releases.controls.length === 1"
                [disabled]="releases.controls.length === 1"
                title="Remove release">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    
    <!-- Add Release Button -->
    <button type="button" 
      (click)="addRelease()" 
      class="mt-3 px-4 py-2 bg-green-500 text-white rounded-md hover:bg-green-600 transition-colors flex items-center gap-2 text-sm">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      Add Release
    </button>
  </form>
</div>
