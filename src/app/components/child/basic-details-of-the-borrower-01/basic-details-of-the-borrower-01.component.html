<div class="section-div p-4 bg-white rounded-lg shadow">
  <h3 class="text-lg font-semibold mb-4">Basic Details of the Borrower</h3>
  <form [formGroup]="form" class="space-y-4">
    
    <!-- a. Name of Division and Regional Office -->
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium mb-1">a. Name of Division *</label>
        <input formControlName="divisionName" type="text" class="w-full p-2 border rounded" placeholder="Enter division name">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Regional Office *</label>
        <input formControlName="regionalOffice" type="text" class="w-full p-2 border rounded" placeholder="Enter regional office">
      </div>
    </div>

    <!-- b. Name of Account and date of classification as NPA -->
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium mb-1">b. Name of Account *</label>
        <input formControlName="accountName" type="text" class="w-full p-2 border rounded" placeholder="Enter account name">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Date of Classification as NPA *</label>
        <input formControlName="npaClassificationDate" type="date" class="w-full p-2 border rounded">
      </div>
    </div>

    <!-- c. Business Activity of the society -->
    <div>
      <label class="block text-sm font-medium mb-1">c. Business Activity of the Society *</label>
      <input formControlName="businessActivity" type="text" class="w-full p-2 border rounded" placeholder="Enter business activity">
    </div>

    <!-- d. Contact Details - Board Members -->
    <div class="mt-6">
      <h4 class="text-md font-medium mb-3">d. Contact Details - Board Members</h4>
      <div formArrayName="boardMembers">
        <table class="w-full border-collapse border border-gray-300">
          <thead>
            <tr class="bg-gray-100">
              <th class="border border-gray-300 p-2 text-left w-12">Sr.</th>
              <th class="border border-gray-300 p-2 text-left">Name of Chairman, President, VC, Directors and Board Members</th>
              <th class="border border-gray-300 p-2 text-left">Designation</th>
              <th class="border border-gray-300 p-2 text-left">Contact Details</th>
              <th class="border border-gray-300 p-2 text-left">Address</th>
              <th class="border border-gray-300 p-2 text-left w-24">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let member of boardMembers.controls; let i = index" [formGroupName]="i">
              <td class="border border-gray-300 p-2">{{i+1}}</td>
              <td class="border border-gray-300 p-2">
                <input formControlName="name" placeholder="Name" class="w-full p-1 border rounded">
              </td>
              <td class="border border-gray-300 p-2">
                <input formControlName="designation" placeholder="Designation" class="w-full p-1 border rounded">
              </td>
              <td class="border border-gray-300 p-2">
                <input formControlName="contactDetails" placeholder="Contact Details" class="w-full p-1 border rounded">
              </td>
              <td class="border border-gray-300 p-2">
                <input formControlName="address" placeholder="Address" class="w-full p-1 border rounded">
              </td>
              <td class="border border-gray-300 p-2">
                <button type="button" (click)="removeMember(i)" class="px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600 text-sm">Delete</button>
              </td>
            </tr>
          </tbody>
        </table>
        <button type="button" (click)="addMember()" class="mt-3 px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">Add Member</button>
      </div>
    </div>

    <!-- e. Registered Address, Corporate office, Factory Address -->
    <div class="grid grid-cols-1 gap-4 mt-6">
      <div>
        <label class="block text-sm font-medium mb-1">e. Registered Address of the Society *</label>
        <input formControlName="registeredAddress" type="text" class="w-full p-2 border rounded" placeholder="Enter registered address">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Corporate Office of the Society *</label>
        <input formControlName="corporateOffice" type="text" class="w-full p-2 border rounded" placeholder="Enter corporate office address">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Factory Address *</label>
        <input formControlName="factoryAddress" type="text" class="w-full p-2 border rounded" placeholder="Enter factory address">
      </div>
    </div>

    <!-- f. Whether Factory/Mill is in running condition -->
    <div class="grid grid-cols-2 gap-4 mt-6">
      <div>
        <label class="block text-sm font-medium mb-1">f. Whether Factory/Mill is in running condition: *</label>
        <select formControlName="factoryRunningCondition" class="w-full p-2 border rounded">
          <option value="">Select</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
      </div>
      <div *ngIf="form.get('factoryRunningCondition')?.value === 'no'">
        <label class="block text-sm font-medium mb-1">If No, since when *</label>
        <input formControlName="factoryNotRunningSince" type="text" class="w-full p-2 border rounded" placeholder="Enter date">
      </div>
    </div>

    <!-- g. Whether Factory/Mill is leased out/ rented -->
    <div class="grid grid-cols-3 gap-4 mt-6">
      <div>
        <label class="block text-sm font-medium mb-1">g. Whether Factory/Mill is leased out/rented: *</label>
        <select formControlName="factoryLeasedOut" class="w-full p-2 border rounded">
          <option value="">Select</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
      </div>
      <div *ngIf="form.get('factoryLeasedOut')?.value === 'yes'">
        <label class="block text-sm font-medium mb-1">Name of Lessee *</label>
        <input formControlName="lesseeName" type="text" class="w-full p-2 border rounded" placeholder="Enter lessee name">
      </div>
      <div *ngIf="form.get('factoryLeasedOut')?.value === 'yes'">
        <label class="block text-sm font-medium mb-1">Contact Details of Lessee *</label>
        <input formControlName="lesseeContactDetails" type="text" class="w-full p-2 border rounded" placeholder="Enter lessee contact">
      </div>
    </div>

  </form>
</div>
