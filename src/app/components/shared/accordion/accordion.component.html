<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden transition-all duration-300 hover:shadow-md"
     [class.open]="expanded">
  <!-- Header -->
  <button
    (click)="toggle()"
    class="w-full bg-gradient-to-r from-gray-700 to-blue-500 px-6 py-4 flex items-center justify-between hover:from-gray-600 hover:to-blue-400 transition-all duration-200">
    
    <div class="flex items-center">
      <!-- Icon -->
      <svg class="w-5 h-5 mr-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="getIconPath()"/>
      </svg>
      
      <!-- Title -->
      <h2 class="text-lg font-bold text-white">{{ title }}</h2>
    </div>

    <div class="flex items-center gap-3">
      <!-- Badge -->
      <span *ngIf="badge" class="px-2 py-1 bg-white/20 rounded text-xs font-medium text-white backdrop-blur-sm">
        {{ badge }}
      </span>

      <!-- Expand/Collapse Arrow -->
      <svg
        class="w-5 h-5 text-white transform transition-transform duration-200"
        [class.rotate-180]="expanded"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
      </svg>
    </div>
  </button>

  <!-- Content -->
  <div *ngIf="expanded" class="p-6 animate-fadeIn">
    <ng-content></ng-content>
  </div>
</div>
