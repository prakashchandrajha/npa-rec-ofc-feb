<!-- NPA Form Section -->
<div class="max-w-8xl mx-auto divide-y shadow shadow-blue-600 rounded-xl">
    <details class="group" open>
        <summary class="flex items-center gap-3 px-4 py-3 font-medium marker:content-none hover:cursor-pointer bg-gray-50">
            <svg class="w-5 h-5 text-gray-500 transition group-open:rotate-90" xmlns="http://www.w3.org/2000/svg"
                width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                    d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z">
                </path>
            </svg>
            <span>Borrower Details</span>
        </summary>

        <article class="px-4 pb-4">
           <app-basic-details-of-the-borrower-01></app-basic-details-of-the-borrower-01>
        </article>
    </details>
    
    <!-- Submit Button -->
    <div class="p-4 bg-gray-50 flex justify-end">
        <button 
            type="button" 
            (click)="onSubmit()" 
            class="px-6 py-2 bg-blue-600 text-white font-medium rounded hover:bg-blue-700 transition-colors">
            Submit
        </button>
    </div>
</div>
