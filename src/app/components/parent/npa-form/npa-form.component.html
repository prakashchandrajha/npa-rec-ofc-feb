<!-- NPA Form Section -->
<div class="max-w-8xl mx-auto divide-y shadow shadow-blue-600 rounded-xl">
    <!-- Section 1: Basic Details of the Borrower -->
    <details class="group" open>
        <summary class="flex items-center gap-3 px-4 py-3 font-medium marker:content-none hover:cursor-pointer bg-gray-50">
            <svg class="w-5 h-5 text-gray-500 transition group-open:rotate-90" xmlns="http://www.w3.org/2000/svg"
                width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                    d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z">
                </path>
            </svg>
            <span>1. Basic Details of the Borrower</span>
        </summary>

        <article class="px-4 pb-4">
           <app-basic-details-of-the-borrower-01></app-basic-details-of-the-borrower-01>
        </article>
    </details>
    
    <!-- Section 2: Facility Sanctioned -->
    <details class="group" open>
        <summary class="flex items-center gap-3 px-4 py-3 font-medium marker:content-none hover:cursor-pointer bg-gray-50">
            <svg class="w-5 h-5 text-gray-500 transition group-open:rotate-90" xmlns="http://www.w3.org/2000/svg"
                width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                    d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z">
                </path>
            </svg>
            <span>2. Facility Sanctioned</span>
        </summary>

        <article class="px-4 pb-4">
           <app-facility-sanctioned></app-facility-sanctioned>
        </article>
    </details>
    
    <!-- Section 3: Details of Security -->
    <details class="group" open>
        <summary class="flex items-center gap-3 px-4 py-3 font-medium marker:content-none hover:cursor-pointer bg-gray-50">
            <svg class="w-5 h-5 text-gray-500 transition group-open:rotate-90" xmlns="http://www.w3.org/2000/svg"
                width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                    d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z">
                </path>
            </svg>
            <span>3. Details of Security</span>
        </summary>

        <article class="px-4 pb-4">
           <app-security-details></app-security-details>
        </article>
    </details>
    
    <!-- Section 6: Release Details -->
    <details class="group" open>
        <summary class="flex items-center gap-3 px-4 py-3 font-medium marker:content-none hover:cursor-pointer bg-gray-50">
            <svg class="w-5 h-5 text-gray-500 transition group-open:rotate-90" xmlns="http://www.w3.org/2000/svg"
                width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                    d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z">
                </path>
            </svg>
            <span>6. Release Details</span>
        </summary>

        <article class="px-4 pb-4">
           <app-release-details></app-release-details>
        </article>
    </details>
    
    <!-- Section 7: Post Dated Cheques Details -->
    <details class="group" open>
        <summary class="flex items-center gap-3 px-4 py-3 font-medium marker:content-none hover:cursor-pointer bg-gray-50">
            <svg class="w-5 h-5 text-gray-500 transition group-open:rotate-90" xmlns="http://www.w3.org/2000/svg"
                width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                    d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z">
                </path>
            </svg>
            <span>7. Post Dated Cheques Details</span>
        </summary>

        <article class="px-4 pb-4">
           <app-post-dated-cheques-details></app-post-dated-cheques-details>
        </article>
    </details>
    
        <!-- Section 8: Original Repayment Schedule -->
        <details class="group" open>
            <summary class="flex items-center gap-3 px-4 py-3 font-medium marker:content-none hover:cursor-pointer bg-gray-50">
                <svg class="w-5 h-5 text-gray-500 transition group-open:rotate-90" xmlns="http://www.w3.org/2000/svg"
                    width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd"
                        d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z">
                    </path>
                </svg>
                <span>8. Original Repayment Schedule</span>
            </summary>

            <article class="px-4 pb-4">
               <app-repayment-schedule></app-repayment-schedule>
            </article>
        </details>
    
    <!-- Future sections will be added here -->
    <!-- Section 4: Guarantor Details -->
    <!-- Section 5: Other Details -->
    <!-- etc. -->
    
    <!-- Error Message -->
    <div *ngIf="errorMessage" class="mx-4 mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded">
        <p class="font-medium">Error:</p>
        <p>{{ errorMessage }}</p>
    </div>
    
    <!-- Submit Button -->
    <div class="p-4 bg-gray-50 flex justify-end">
        <button 
            type="button" 
            (click)="onSubmit()" 
            [disabled]="isSubmitting"
            class="px-6 py-2 bg-blue-600 text-white font-medium rounded hover:bg-blue-700 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed">
            <span *ngIf="!isSubmitting">Submit</span>
            <span *ngIf="isSubmitting" class="flex items-center gap-2">
                <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Submitting...
            </span>
        </button>
    </div>
</div>

<!-- Success Modal -->
<div *ngIf="showModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4">
        <div class="text-center">
            <!-- Success Icon -->
            <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-green-100 mb-4">
                <svg class="h-6 w-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            
            <h3 class="text-lg font-medium text-gray-900 mb-2">NPA Created Successfully!</h3>
            <p class="text-sm text-gray-500 mb-6">
                Your NPA has been created with ID: <strong>{{ npaId }}</strong>
            </p>
            
            <!-- Action Buttons -->
            <div class="flex gap-3 justify-center">
                <button 
                    (click)="navigateToNpaDetail()"
                    class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded hover:bg-blue-700 transition-colors">
                    View Details
                </button>
                <button 
                    (click)="navigateToNpaList()"
                    class="px-4 py-2 bg-gray-200 text-gray-800 text-sm font-medium rounded hover:bg-gray-300 transition-colors">
                    Go to List
                </button>
                <button 
                    (click)="closeModal()"
                    class="px-4 py-2 border border-gray-300 text-gray-700 text-sm font-medium rounded hover:bg-gray-50 transition-colors">
                    Close
                </button>
            </div>
        </div>
    </div>
</div>
